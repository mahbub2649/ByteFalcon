<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="ByteFalcon: see what's eating your disk, then clean it safely">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b1f"/>
      <stop offset="1" stop-color="#07131a"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.88" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.6" cy="0.1" r="0.4">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.55" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="streak" gradientUnits="userSpaceOnUse" x1="-78" y1="0" x2="-190" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="340" rx="24" fill="url(#glowA)"/>
  <rect width="1280" height="340" rx="24" fill="url(#glowB)"/>
  <rect width="1280" height="340" rx="24" fill="url(#glowC)"/>

  <!-- Mark: a disk ring being swept, with speed streaks trailing it -->
  <g transform="translate(220 170)">
    <path d="M-150 -38H-70" stroke="url(#streak)" stroke-width="6" stroke-linecap="round"/>
    <path d="M-185 0H-78" stroke="url(#streak)" stroke-width="6" stroke-linecap="round"/>
    <path d="M-150 38H-70" stroke="url(#streak)" stroke-width="6" stroke-linecap="round"/>
    <circle r="70" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="18"/>
    <circle r="70" fill="none" stroke="url(#brand)" stroke-width="18" stroke-linecap="round"
            stroke-dasharray="330 440" transform="rotate(-90)">
      <animateTransform attributeName="transform" type="rotate" from="-90" to="270" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle r="34" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
    <path d="M6 -24 L-14 4 H0 L-6 24 L14 -4 H0 Z" fill="url(#brand)"/>
  </g>

  <g font-family="Inter, 'Segoe UI', -apple-system, system-ui, Helvetica, Arial, sans-serif">
    <text x="360" y="158" font-size="84" font-weight="800" fill="#f5f3ff" letter-spacing="-2">Byte<tspan fill="url(#brand)">Falcon</tspan></text>
    <text x="364" y="208" font-size="27" fill="#c4c2e0">See what's eating your disk. Clean it safely, in seconds.</text>

    <g font-size="17" font-weight="600" fill="#e2e6ff">
      <rect x="364" y="240" width="186" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="457" y="266" text-anchor="middle">⚡ 200k+ files/sec</text>
      <rect x="562" y="240" width="180" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="652" y="266" text-anchor="middle">🧹 Safe Smart Clean</text>
      <rect x="754" y="240" width="168" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="838" y="266" text-anchor="middle">🧬 Duplicate finder</text>
      <rect x="934" y="240" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="1009" y="266" text-anchor="middle">🐧 Native C++</text>
    </g>
  </g>
</svg>
